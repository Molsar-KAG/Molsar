<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>MOLSAR</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    text-align: center;
}

header {
    background: linear-gradient(90deg, #2563eb, #7c3aed);
    padding: 40px 20px;
}

h1 {
    margin: 0;
    font-size: 48px;
    letter-spacing: 2px;
}

p {
    font-size: 18px;
}

.container {
    padding: 40px 20px;
}

.gallery {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
}

.gallery img {
    width: 250px;
    border-radius: 12px;
    transition: 0.3s;
}

.gallery img:hover {
    transform: scale(1.05);
}

footer {
    margin-top: 40px;
    padding: 20px;
    background: #020617;
    font-size: 14px;
}
</style>

</head>

<body>

<header>
    <h1>MOLSAR</h1>
    <p>Moja strona internetowa</p>
</header>

<div class="container">
    <h2>O mnie</h2>
    <p>Witaj! To moja pierwsza strona stworzona na GitHub Pages.</p>
</div>

<div class="container">
    <h2>Galeria</h2>
    <div class="gallery">
        <img src="https://via.placeholder.com/300">
        <img src="https://via.placeholder.com/300">
        <img src="https://via.placeholder.com/300">
    </div>
</div>

<div class="container">
    <h2>Kontakt</h2>
    <p>Email: twojemail@example.com</p>
</div>

<footer>
    © 2026 MOLSAR
</footer>

</body>
</html>
